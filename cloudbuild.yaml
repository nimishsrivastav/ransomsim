steps:
  # 1. Build & Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ransomsim-backend'
      - '-f'
      - 'Dockerfile.backend'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ransomsim-backend']

  # 2. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ransomsim-backend'
      - '--image=gcr.io/$PROJECT_ID/ransomsim-backend'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GEMINI_MODEL=gemini-2.0-flash-exp'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=900'

  # 3. Get Backend URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$(gcloud run services describe ransomsim-backend \
          --region=us-central1 \
          --format='value(status.url)')
        echo $BACKEND_URL > /workspace/backend_url.txt
        echo "Backend URL: $BACKEND_URL"

  # 4. Build Frontend with Backend URL
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        docker build \
          -t gcr.io/$PROJECT_ID/ransomsim-frontend \
          -f Dockerfile.frontend \
          --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL \
          .

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ransomsim-frontend']

  # 5. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        FRONTEND_URL=$(gcloud run deploy ransomsim-frontend \
          --image=gcr.io/$PROJECT_ID/ransomsim-frontend \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --timeout=60 \
          --quiet \
          --format='value(status.url)')
        echo "Frontend URL: $FRONTEND_URL"

        # 6. Update Backend CORS
        gcloud run services update ransomsim-backend \
          --region=us-central1 \
          --update-env-vars=ALLOWED_ORIGINS="$FRONTEND_URL,http://localhost:3000" \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY
